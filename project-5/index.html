<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 5 — Generator Pola Zigzag</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 5 — Generator Pola Zigzag</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'retro',   latar: '#f2e0c8', warna: ['#e76f51','#f4a261','#2a9d8f','#264653','#e9c46a','#d90429','#faa307'] },
  { nama: 'sunset',  latar: '#1a0e0a', warna: ['#ff6b35','#ff8c42','#ffa62b','#ffc300','#ffd166','#e85d04','#fb8500'] },
  { nama: 'laut',    latar: '#0a1628', warna: ['#1a6fa0','#2196c8','#34b5d4','#5cc8e0','#89d8ea','#0e5a7e','#2980b9'] },
  { nama: 'pastel',  latar: '#f7f2ea', warna: ['#a8d8ea','#aa96da','#fcbad3','#b5ead7','#ffd3b6','#c7ceea','#ffb4a2'] },
  { nama: 'kontras', latar: '#0a0a0a', warna: ['#ff0054','#00ff88','#ffee00','#00aaff','#ff6600','#cc00ff','#ffffff'] },
];

function kurvaZigzag(ctx, x0, x1, y, amp, mode, geser) {
  ctx.beginPath();
  ctx.moveTo(x0, y);
  let naik = true;
  if (mode === 'patah') {
    const segW = Math.max(24, amp * 0.6);
    for (let x = x0; x <= x1; x += segW) {
      ctx.lineTo(x, y + (naik ? -amp : amp));
      naik = !naik;
    }
  } else if (mode === 'gigi') {
    const segW = Math.max(16, amp * 0.45);
    let naik2 = true;
    for (let x = x0; x <= x1; x += segW) {
      ctx.lineTo(x, y + (naik2 ? -amp : amp));
      ctx.lineTo(x + segW, y + (naik2 ? -amp : amp));
      naik2 = !naik2;
    }
  } else {
    const freq = Math.max(1, amp * 0.05);
    for (let x = x0; x <= x1; x += 12) {
      ctx.lineTo(x, y + Math.sin(((x + geser) * freq) / 400) * amp);
    }
  }
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const mode = pilih(R, ['patah', 'gigi', 'gelombang']);
  const jumlah = rint(R, 8, 20);
  const amp = rentang(R, 120, 420);
  const tebal = rentang(R, 90, 380);
  const gradien = R() < 0.5;
  const opacityVariasi = R() < 0.35;
  const sudut = pilih(R, [0, 1]); 
  const miring = pilih(R, [0, 1]);
  const outline = R() < 0.3;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  ctx.save();
  if (miring) ctx.rotate(0.08);
  ctx.translate(S / 2, S / 2);
  if (sudut) ctx.rotate(Math.PI / 4);

  const span = S * Math.SQRT2 + 800;
  const jarak = span / jumlah;
  const grad = gradien ? ctx.createLinearGradient(-span / 2, -span / 2, span / 2, span / 2)
    : null;
  if (grad) palet.warna.forEach((w, i) => grad.addColorStop(i / (palet.warna.length - 1), w));

  for (let i = 0; i <= jumlah; i++) {
    const y = -span / 2 + i * jarak;
    const warna = grad || palet.warna[i % palet.warna.length];

    if (outline) {
      ctx.beginPath();
      ctx.strokeStyle = warna;
      ctx.lineWidth = tebal;
      ctx.lineJoin = mode === 'patah' ? 'miter' : 'round';
      kurvaZigzag(ctx, -span / 2, span / 2, y, amp, mode, y);
      ctx.stroke();
      if (i % 3 === 0) {
        kurvaZigzag(ctx, -span / 2, span / 2, y, amp, mode, y);
        ctx.strokeStyle = palet.latar;
        ctx.lineWidth = tebal * 0.35;
        ctx.stroke();
      }
    } else {
      const atas = -tebal / 2, bawah = tebal / 2;
      ctx.beginPath();
      kurvaZigzag(ctx, -span / 2, span / 2, y + atas, amp, mode, y);
      kurvaZigzag(ctx, span / 2, -span / 2, y + bawah, amp, mode, y);
      ctx.closePath();
      ctx.fillStyle = warna;
      if (opacityVariasi) ctx.globalAlpha = clamp(0.5 + R() * 0.6, 0.4, 1);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  const labelMode = { patah: 'zigzag patah', gigi: 'gigi gergaji', gelombang: 'gelombang lembut' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelMode[mode]}, ${gradien ? 'gradien' : 'acak'}, ${outline ? 'outline' : 'pita'} — file: zigzag-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `zigzag-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
