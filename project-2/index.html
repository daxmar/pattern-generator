<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 2 — Generator Pola Polkadot</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 2 — Generator Pola Polkadot</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function parameterAcak(R) {
  const mode = pilih(R, ['grid', 'offset', 'scatter']);
  const gaya = pilih(R, ['berani', 'pastel', 'gelap']);
  const bentuk = pilih(R, ['isi', 'lingkaran', 'donat']);
  return { mode, gaya, bentuk,
    jumlahBaris: rint(R, 6, 14),
    jumlahKolom: rint(R, 6, 14),
    ukMin: rentang(R, 80, 200),
    ukMax: rentang(R, 300, 700),
    jarak: rentang(R, 250, 650),
    getar: rentang(R, 0, 0.4),
    gradienUkuran: R() < 0.5,
    gradienPosisi: pilih(R, ['tak ada', 'pusat', 'sudut']),
    opacityRange: rentang(R, 0.5, 1.0),
    ketebalanLingkaran: rentang(R, 18, 50),
  };
}

function buatPalet(R, gaya, n) {
  const h = rint(R, 0, 360);
  let s, l, hueStep;
  if (gaya === 'pastel') { s = 40; l = 76; hueStep = pilih(R, [20, 40]); }
  else if (gaya === 'gelap') { s = 65; l = 44; hueStep = pilih(R, [180, 210]); }
  else { s = 75; l = 52; hueStep = pilih(R, [12, 28, 35]); }

  const warna = [];
  for (let i = 0; i < n; i++) {
    const hh = (h + i * hueStep) % 360;
    const ll = clamp(l + ((i % 2) ? 12 : -8), 18, 92);
    warna.push(`hsl(${hh} ${s}% ${ll}%)`);
  }
  const latar = gaya === 'pastel' ? `hsl(${h} 28% 93%)`
    : gaya === 'gelap' ? `hsl(${h} 40% 11%)`
      : `hsl(${h} 32% 14%)`;
  return { warna, latar };
}

function ukuranDot(R, p, i, j) {
  const rasio = p.gradienUkuran
    ? (Math.sqrt((i - p.jumlahBaris / 2) ** 2 + (j - p.jumlahKolom / 2) ** 2) / Math.sqrt(p.jumlahBaris ** 2 + p.jumlahKolom ** 2))
    : R();
  return p.ukMin + (p.ukMax - p.ukMin) * rasio;
}

function pusatGrid(p, i, j) {
  const ox = p.gradienPosisi === 'sudut' ? rentang(R, -p.jarak * 0.1, p.jarak * 0.1) : 0;
  const oy = p.gradienPosisi === 'sudut' ? rentang(R, -p.jarak * 0.1, p.jarak * 0.1) : 0;
  const gx = p.margin + j * p.jarak + (p.mode === 'offset' && i % 2 === 1 ? p.jarak / 2 : 0) + ox;
  const gy = p.margin + i * p.jarak + oy;
  if (p.gradienPosisi === 'pusat') {
    const cx = S / 2, cy = S / 2;
    const dx = gx - cx, dy = gy - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = S * 0.6;
    const scale = 0.4 + 0.6 * (dist / maxDist);
    return { x: cx + dx * scale, y: cy + dy * scale };
  }
  return { x: gx, y: gy };
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const p = parameterAcak(R);
  p.margin = p.ukMax + 100;
  const pal = buatPalet(R, p.gaya, Math.max(p.jumlahBaris, p.jumlahKolom) + 2);
  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = pal.latar;
  ctx.fillRect(0, 0, S, S);

  if (p.mode === 'scatter') {
    const dots = [];
    const maxAttempts = p.jumlahBaris * p.jumlahKolom * 8;
    for (let a = 0; a < maxAttempts && dots.length < p.jumlahBaris * p.jumlahKolom; a++) {
      const x = rentang(R, p.margin, S - p.margin);
      const y = rentang(R, p.margin, S - p.margin);
      const uk = rentang(R, p.ukMin, p.ukMax);
      let ok = true;
      for (const d of dots) {
        const dx = d.x - x, dy = d.y - y;
        if (dx * dx + dy * dy < (d.uk + uk + p.jarak * 0.2) ** 2) { ok = false; break; }
      }
      if (ok) dots.push({ x, y, uk });
    }
    for (const d of dots) {
      const opasitas = clamp(p.opacityRange + rentang(R, -0.15, 0.15), 0.3, 1);
      const warna = pal.warna[Math.floor(R() * pal.warna.length)];
      gambarDot(ctx, d.x, d.y, d.uk, p.bentuk, warna, opasitas, p.ketebalanLingkaran);
    }
  } else {
    for (let i = -1; i <= p.jumlahBaris; i++) {
      for (let j = -1; j <= p.jumlahKolom + 1; j++) {
        const pos = pusatGrid(p, i, j);
        if (pos.x < -p.ukMax || pos.x > S + p.ukMax || pos.y < -p.ukMax || pos.y > S + p.ukMax) continue;
        const uk = ukuranDot(R, p, i, j);
        const opasitas = clamp(p.opacityRange + rentang(R, -0.1, 0.1), 0.35, 1);
        const warna = pal.warna[(i + j) % pal.warna.length];
        gambarDot(ctx, pos.x, pos.y, uk, p.bentuk, warna, opasitas, p.ketebalanLingkaran);
      }
    }
  }

  const labelBentuk = { isi: 'isi penuh', lingkaran: 'lingkaran', donat: 'donat' };
  info.textContent = `Seed ${seedInt} · ${p.mode}, ${p.gaya}, ${labelBentuk[p.bentuk]}, ${p.gradienUkuran ? 'ukuran gradien' : 'ukuran acak'} — file: polkadot-${seedInt}-<timestamp>.jpg`;
}

function gambarDot(ctx, x, y, uk, bentuk, warna, opasitas, ketebalan) {
  ctx.globalAlpha = opasitas;
  ctx.fillStyle = warna;
  ctx.strokeStyle = warna;
  const r = uk / 2;
  ctx.beginPath();
  if (bentuk === 'isi') {
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.lineWidth = bentuk === 'donat' ? ketebalan * 2.5 : ketebalan;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `polkadot-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
