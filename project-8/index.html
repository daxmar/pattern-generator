<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 8 — Generator Pola Triangle</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 8 — Generator Pola Triangle</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const SQ3 = Math.sqrt(3);
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'berani',  latar: '#14161a', warna: ['#ef476f','#ffd166','#06d6a0','#118ab2','#ff5d5d','#f78c6b','#a7f3d0'] },
  { nama: 'lembut',  latar: '#f6f1e9', warna: ['#f4a7bb','#a3d9a5','#7ec8e3','#f7c59f','#d4a5d0','#ffe66d','#98d8c8'] },
  { nama: 'pastel',  latar: '#0f1115', warna: ['#6c5ce7','#a29bfe','#fd79a8','#00cec9','#ffeaa7','#fab1a0','#dfe6e9'] },
  { nama: 'cerah',   latar: '#0a0a0a', warna: ['#ff0054','#00ff88','#ffee00','#00aaff','#ff6600','#cc00ff','#ffffff'] },
  { nama: 'tanah',   latar: '#efe6d6', warna: ['#7a5c3e','#b3853f','#c96f3b','#8a6f52','#d99a5b','#5f4433','#e0b072'] },
];

function segitiga(ctx, x1, y1, x2, y2, x3, y3) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.closePath();
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const bentuk = pilih(R, ['solid', 'outline', 'garis']);
  const ukuran = rentang(R, 260, 720);
  const variasiWarna = R() < 0.7;
  const miring = R() < 0.5;
  const opacityVariasi = R() < 0.35;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  const margin = ukuran * 1.5;
  const cols = Math.ceil((S + margin * 2) / ukuran) + 2;
  const rows = Math.ceil((S + margin * 2) / (ukuran * SQ3)) + 2;

  ctx.save();
  if (miring) {
    ctx.translate(S / 2, S / 2);
    ctx.rotate(0.1);
    ctx.translate(-S / 2, -S / 2);
  }

  for (let row = 0; row < rows; row++) {
    const offsetX = row % 2 ? ukuran / 2 : 0;
    for (let col = 0; col < cols; col++) {
      const x = col * ukuran + offsetX - margin;
      const y = row * ukuran * SQ3 - margin;
      const alt = row % 2 === col % 2;

      const warna = variasiWarna ? pilih(R, palet.warna) : palet.warna[(row + col) % palet.warna.length];
      const tb = palet.warna[(row + col + 1) % palet.warna.length];

      if (bentuk === 'garis') {
        const tc = Math.max(ukuran * 0.06, 8);
        ctx.strokeStyle = warna;
        ctx.lineWidth = tc;
        ctx.beginPath();
        ctx.moveTo(x - ukuran, y + ukuran * SQ3 * 0.5);
        ctx.lineTo(x + ukuran, y + ukuran * SQ3 * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y + ukuran * SQ3);
        ctx.lineTo(x, y);
        ctx.stroke();
      } else {
        const x3 = x + ukuran / 2, y3 = y + ukuran * SQ3;
        if (alt) {
          ctx.fillStyle = warna;
          ctx.strokeStyle = warna;
          ctx.lineWidth = Math.max(ukuran * 0.03, 6);
          ctx.lineJoin = 'round';
          if (opacityVariasi) ctx.globalAlpha = clamp(0.55 + R() * 0.55, 0.4, 1);
          segitiga(ctx, x, y, x + ukuran, y, x3, y3);
          if (bentuk === 'solid') ctx.fill();
          else ctx.stroke();
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = tb;
          ctx.strokeStyle = tb;
          if (opacityVariasi) ctx.globalAlpha = clamp(0.55 + R() * 0.55, 0.4, 1);
          segitiga(ctx, x + ukuran, y, x + ukuran / 2, y3, x3, y3);
          if (bentuk === 'solid') ctx.fill();
          else ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }
  ctx.restore();

  const labelBentuk = { solid: 'solid', outline: 'outline', garis: 'garis' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelBentuk[bentuk]}, ${miring ? 'miring' : 'tegak'} — file: triangle-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `triangle-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
