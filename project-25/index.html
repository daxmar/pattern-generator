<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 25 — Generator Pola Spiral</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 25 — Generator Pola Spiral</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'nebula',  latar: '#0a0a1a', warna: ['#7b2ff7','#a855f7','#c084fc','#e879f9','#f0abfc','#818cf8','#6366f1'] },
  { nama: 'sunset',  latar: '#1a0a0a', warna: ['#f97316','#ef4444','#f59e0b','#eab308','#fbbf24','#fb923c','#dc2626'] },
  { nama: 'ocean',   latar: '#061220', warna: ['#06b6d4','#0ea5e9','#38bdf8','#22d3ee','#2dd4bf','#0891b2','#0284c7'] },
  { nama: 'forest',  latar: '#081208', warna: ['#22c55e','#16a34a','#10b981','#34d399','#4ade80','#15803d','#059669'] },
  { nama: 'cosmic',  latar: '#0f0a14', warna: ['#d946ef','#ec4899','#f43f5e','#a855f7','#c084fc','#8b5cf6','#f472b6'] },
];

function drawSpiralArm(ctx, cx, cy, turns, maxR, gap, color, lw) {
  ctx.beginPath();
  const steps = Math.floor(turns * 120);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const angle = t * turns * TAU;
    const r = t * maxR;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.stroke();
}

function drawSpiralStar(ctx, cx, cy, rays, innerR, outerR, color) {
  ctx.beginPath();
  for (let i = 0; i < rays * 2; i++) {
    const angle = (i / (rays * 2)) * TAU - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawSpiralRing(ctx, cx, cy, radius, segments, color, lw) {
  ctx.beginPath();
  const segAngle = TAU / segments;
  const segLen = radius * 0.6;
  for (let i = 0; i < segments; i++) {
    const a = i * segAngle;
    const a2 = a + segAngle * 0.7;
    const x1 = cx + Math.cos(a) * radius;
    const y1 = cy + Math.sin(a) * radius;
    const x2 = cx + Math.cos(a2) * (radius + segLen);
    const y2 = cy + Math.sin(a2) * (radius + segLen);
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.stroke();
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const tipe = pilih(R, ['multi', 'tunggal', 'cincin']);
  const variasiWarna = R() < 0.7;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  if (tipe === 'multi') {
    const motifR = rentang(R, 200, 500);
    const spacing = motifR * 2;
    const cols = Math.ceil((S + spacing) / spacing) + 1;
    const rows = Math.ceil((S + spacing) / spacing) + 1;
    const offset = spacing * 0.5;

    for (let row = -1; row < rows; row++) {
      for (let col = -1; col < cols; col++) {
        const cx = col * spacing + offset;
        const cy = row * spacing + offset;
        const warna = variasiWarna ? pilih(R, palet.warna) : palet.warna[(row + col) % palet.warna.length];
        const turns = rentang(R, 2, 6);
        const maxR = motifR * rentang(R, 0.7, 1.0);
        const lw = Math.max(maxR * 0.04, 3);

        drawSpiralArm(ctx, cx, cy, turns, maxR, motifR * 0.1, warna, lw);
        drawSpiralStar(ctx, cx, cy, rint(R, 4, 8), maxR * 0.08, maxR * 0.18, warna);
      }
    }
  } else if (tipe === 'tunggal') {
    const cx = S / 2 + rentang(R, -S * 0.15, S * 0.15);
    const cy = S / 2 + rentang(R, -S * 0.15, S * 0.15);
    const arms = rint(R, 3, 8);
    const maxR = S * rentang(R, 0.35, 0.48);
    const turns = rentang(R, 5, 12);

    for (let a = 0; a < arms; a++) {
      const armColor = variasiWarna ? pilih(R, palet.warna) : palet.warna[a % palet.warna.length];
      const armOffset = (a / arms) * TAU;
      const steps = Math.floor(turns * 120);
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const angle = armOffset + t * turns * TAU;
        const r = t * maxR;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = armColor;
      ctx.lineWidth = Math.max(maxR * 0.005, 3);
      ctx.stroke();
    }

    const ringCount = rint(R, 4, 10);
    for (let i = 0; i < ringCount; i++) {
      const r = maxR * ((i + 1) / (ringCount + 1));
      const color = pilih(R, palet.warna);
      drawSpiralRing(ctx, cx, cy, r, rint(R, 8, 16), color, Math.max(r * 0.02, 2));
    }

    drawSpiralStar(ctx, cx, cy, rint(R, 5, 10), maxR * 0.06, maxR * 0.14, pilih(R, palet.warna));
  } else {
    const motifR = rentang(R, 220, 480);
    const spacing = motifR * 2;
    const cols = Math.ceil((S + spacing) / spacing) + 1;
    const rows = Math.ceil((S + spacing) / spacing) + 1;
    const offset = spacing * 0.5;

    for (let row = -1; row < rows; row++) {
      for (let col = -1; col < cols; col++) {
        const cx = col * spacing + offset;
        const cy = row * spacing + offset;
        const warna = variasiWarna ? pilih(R, palet.warna) : palet.warna[(row + col) % palet.warna.length];
        const segments = rint(R, 6, 14);
        const radius = motifR * rentang(R, 0.3, 0.45);
        const lw = Math.max(radius * 0.06, 3);

        drawSpiralRing(ctx, cx, cy, radius, segments, warna, lw);
        drawSpiralStar(ctx, cx, cy, rint(R, 4, 7), radius * 0.12, radius * 0.28, warna);
      }
    }
  }

  const labelTipe = { multi: 'multi-arm spiral', tunggal: 'single spiral raksasa', cincin: 'spiral cincin' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelTipe[tipe]} — file: spiral-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `spiral-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
