<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 9 — Generator Pola Argyle</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 9 — Generator Pola Argyle</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'klasik', latar: '#f5f1ea', warna: ['#2a6f97','#84a98c','#6b4f3a','#c9ada7','#3a7ca5','#9c6644','#52796f'] },
  { nama: 'skot',   latar: '#efe6d6', warna: ['#9b2226','#ce4257','#a4133c','#3a5a40','#588157','#c1121f','#2b9348'] },
  { nama: 'pastel', latar: '#f7f2ea', warna: ['#f4a7bb','#a3d9a5','#c7ceea','#ffd3b6','#b5ead7','#d4a5d0','#ffe66d'] },
  { nama: 'neon',   latar: '#0d0d12', warna: ['#2de2e6','#ff70a6','#ff9770','#803bec','#3bf0a5','#ffd670','#5f27cd'] },
  { nama: 'mono',   latar: '#f2f2f2', warna: ['#1b1b1b','#4d4d4d','#7a7a7a','#a6a6a6','#2b2b2b','#8c8c8c','#5c5c5c'] },
];

function belahKetupat(ctx, cx, cy, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy);
  ctx.lineTo(cx, cy + h / 2);
  ctx.lineTo(cx - w / 2, cy);
  ctx.closePath();
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const bentuk = pilih(R, ['solid', 'outline', 'garis']);
  const lebar = rentang(R, 240, 620);
  const tinggi = lebar * 2;
  const tebalGaris = rentang(R, 0.04, 0.14) * lebar;
  const adaLatarDiagonal = R() < 0.5;
  const variasiWarna = R() < 0.7;
  const opacityVariasi = R() < 0.3;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  const margin = lebar * 2;
  const cols = Math.ceil((S + margin * 2) / lebar) + 2;
  const rows = Math.ceil((S + margin * 2) / tinggi) + 2;

  if (adaLatarDiagonal) {
    ctx.strokeStyle = pilih(R, palet.warna);
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = Math.max(tebalGaris * 0.4, 8);
    const stepD = lebar * 2;
    const longs = Math.ceil((S + margin * 4) / stepD) + 3;
    for (let i = -longs; i < longs + 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * stepD - margin, -margin);
      ctx.lineTo(i * stepD + stepD - margin, S + margin);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-margin, i * stepD - margin);
      ctx.lineTo(S + margin, i * stepD + stepD - margin);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * lebar - margin;
      const y = row * tinggi + (col % 2 ? -tinggi / 2 : 0) - margin;
      const cx = x + lebar / 2;
      const cy = y + tinggi / 2;
      const warna = variasiWarna ? pilih(R, palet.warna) : palet.warna[(row + col) % palet.warna.length];

      if (bentuk === 'garis') {
        ctx.strokeStyle = warna;
        ctx.lineWidth = Math.max(tebalGaris * 0.5, 6);
        ctx.lineJoin = 'round';
        belahKetupat(ctx, cx, cy, lebar * 0.9, tinggi * 0.9);
        ctx.stroke();
      } else {
        ctx.fillStyle = warna;
        ctx.strokeStyle = warna;
        ctx.lineWidth = Math.max(tebalGaris, 6);
        ctx.lineJoin = 'round';
        if (opacityVariasi) ctx.globalAlpha = clamp(0.55 + R() * 0.55, 0.4, 1);
        belahKetupat(ctx, cx, cy, lebar * 0.8, tinggi * 0.8);
        if (bentuk === 'solid') ctx.fill();
        else ctx.stroke();
        ctx.globalAlpha = 1;

        if (bentuk === 'solid') {
          ctx.fillStyle = palet.warna[(row + col + 2) % palet.warna.length];
          ctx.globalAlpha = 0.9;
          belahKetupat(ctx, cx, cy, lebar * 0.22, tinggi * 0.22);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  const labelBentuk = { solid: 'solid + pusat', outline: 'outline', garis: 'garis' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelBentuk[bentuk]}, ${adaLatarDiagonal ? 'diagonal' : 'polos'} — file: argyle-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `argyle-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
