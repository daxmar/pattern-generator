<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 7 — Generator Pola Girih Bintang</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 7 — Generator Pola Girih Bintang</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'turquoise', latar: '#0d2233', warna: ['#f4b942','#e98a5f','#3aa6a0','#7fd1c3','#c98b4c','#287a7a','#ffd97d'] },
  { nama: 'safir',    latar: '#0b1230', warna: ['#2e7ee0','#59a2ff','#8fd0ff','#1f4aa8','#67b6f0','#10437f','#c3e4ff'] },
  { nama: 'terra',    latar: '#1a0d08', warna: ['#d96c3a','#ef9c58','#b4442e','#f0c072','#8a2f1f','#d28a4e','#ffd9a0'] },
  { nama: 'emas',     latar: '#141007', warna: ['#d8a428','#f2c14e','#8a6b1a','#ffe08a','#b88a20','#f7d778','#6b5317'] },
  { nama: 'modern',   latar: '#101216', warna: ['#ffd166','#ef476f','#06d6a0','#118ab2','#073b4c','#f78c6b','#a7f3d0'] },
];

function poligon(ctx, x, y, r, n, rotasi, skalaX, skalaY) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rotasi + (i * TAU) / n;
    const px = x + Math.cos(a) * r * skalaX;
    const py = y + Math.sin(a) * r * skalaY;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function bintangSegi8(ctx, R, x, y, r, warna, latar, bentuk) {
  if (bentuk === 'bintang_pekat') {
    ctx.fillStyle = warna;
    ctx.strokeStyle = latar;
    ctx.lineJoin = 'round';
    ctx.lineWidth = r * 0.05;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const rr = i % 2 === 0 ? r : r * 0.45;
      const a = -Math.PI / 8 + (i * Math.PI) / 8;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (bentuk === 'kerangka') {
    poligon(ctx, x, y, r, 8, Math.PI / 8, 1, 1);
    ctx.strokeStyle = warna;
    ctx.lineWidth = r * 0.12;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.fillStyle = warna;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.14, 0, TAU);
    ctx.fill();
  } else if (bentuk === 'piringan') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(pilih(R, [0, Math.PI / 8]));
    const n = pilih(R, [8, 12, 16]);
    for (let i = 0; i < n; i++) {
      ctx.rotate(Math.PI / 8);
      poligon(ctx, 0, 0, r * 0.92, 8, Math.PI / 8, 1, 1);
      ctx.strokeStyle = warna;
      ctx.lineWidth = r * 0.045;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.42, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  } else {
    // bintang garis
    ctx.strokeStyle = warna;
    ctx.lineWidth = r * 0.08;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 4;
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      ctx.stroke();
    }
  }
}

function bintangKecil(ctx, x, y, r, warna) {
  ctx.fillStyle = warna;
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 8 + (i * Math.PI) / 8;
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const bentuk = pilih(R, ['bintang_pekat', 'kerangka', 'piringan', 'garis']);
  const cell = rentang(R, 420, 850);
  const adaBintangKecil = R() < 0.8;
  const ketebalanVariasi = R() < 0.5;
  const tambahSelempang = R() < 0.6;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  const r = cell * 0.36;
  const margin = cell * 0.6;
  const cols = Math.ceil((S + margin * 2) / cell) + 2;
  const rows = Math.ceil((S + margin * 2) / cell) + 2;

  // latar selempang (jalinan garis) bila dipilih
  if (tambahSelempang) {
    ctx.strokeStyle = pilih(R, palet.warna);
    ctx.globalAlpha = 0.18;
    ctx.lineWidth = cell * 0.05;
    const m2 = cell * 1.5;
    const longs = Math.ceil((S + m2 * 2) / cell) + 3;
    for (let i = -longs; i < longs + 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cell - m2, -m2);
      ctx.lineTo(i * cell + cell - m2, S + m2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-m2, i * cell - m2);
      ctx.lineTo(S + m2, i * cell + cell - m2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * cell - margin;
      const y = row * cell - margin;
      const px = x + cell / 2;
      const py = y + cell / 2;
      const warna = pilih(R, palet.warna);
      const lt = ketebalanVariasi ? rentang(R, 0.8, 1.3) : 1;
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(lt, lt);
      ctx.translate(-px, -py);
      bintangSegi8(ctx, R, px, py, r, warna, palet.latar, bentuk);

      if (adaBintangKecil) {
        bintangKecil(ctx, x + cell * 0.12, y + cell * 0.12, r * 0.22, pilih(R, palet.warna));
      }
      ctx.restore();
    }
  }

  const labelBentuk = {
    bintang_pekat: 'bintang pekat',
    kerangka: 'kerangka 8',
    piringan: 'piringan radial',
    garis: 'garis silang',
  };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelBentuk[bentuk]}, ${tambahSelempang ? 'selempang' : 'polos'} — file: girih-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `girih-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
