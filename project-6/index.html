<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 6 — Generator Pola Batik Kawung</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 6 — Generator Pola Batik Kawung</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'klasik', latar: '#f4ead8', warna: ['#3b2f2a','#7a4f3a','#b07d4f','#5c4436','#8a5a38','#a88254','#2e241f'] },
  { nama: 'indigo', latar: '#eef0f2', warna: ['#1f3a5f','#2e5eaa','#4a88c9','#1c2b4a','#375f9e','#14325a','#6b9fd4'] },
  { nama: 'terracotta', latar: '#f6ece2', warna: ['#9c3b2e','#c0572e','#e07b39','#d2542f','#a8482f','#e8925c','#b5492f'] },
  { nama: 'hijau',  latar: '#f0efe4', warna: ['#2a5d3a','#3f8a4f','#5aa35b','#1f4d2f','#317b43','#6dbb6f','#254f34'] },
  { nama: 'modern', latar: '#14161a', warna: ['#ffd166','#ef476f','#118ab2','#06d6a0','#073b4c','#f78c6b','#ff9770'] },
];

function kelopakKawung(ctx, r, warna, latar, isian) {
  ctx.save();
  ctx.fillStyle = warna;
  ctx.strokeStyle = isian === 'outline' ? warna : latar;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = (i * Math.PI) / 2 + Math.PI / 4;
    const ex = Math.cos(a) * r * 0.82;
    const ey = Math.sin(a) * r * 0.82;
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.6, r * 0.6, a, Math.PI / 6, Math.PI - Math.PI / 6);
    ctx.closePath();
    if (isian === 'outline') {
      ctx.lineWidth = r * 0.05;
      ctx.stroke();
    } else {
      ctx.fill();
      if (isian === 'pola') {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = latar;
        ctx.lineWidth = r * 0.03;
        ctx.beginPath();
        for (let t = r * 0.25; t < r * 0.55; t += r * 0.09) {
          ctx.moveTo(ex, ey - t);
          ctx.lineTo(ex, ey + t);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
  ctx.restore();
}

function titikTengah(ctx, r, warna, latar, punyaTitik) {
  if (!punyaTitik) return;
  ctx.save();
  ctx.fillStyle = latar;
  ctx.strokeStyle = warna;
  ctx.lineWidth = r * 0.05;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.2, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const isian = pilih(R, ['padat', 'pola', 'outline']);
  const ukuran = rentang(R, 330, 900);
  const punyaTitik = R() < 0.7;
  const diagonal = R() < 0.5;
  const motifTengah = R() < 0.35;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  const cell = ukuran;
  const stepK = cell * 0.42;
  const margin = stepK * 1.1;
  const cols = Math.ceil((S + margin * 2) / cell) + 2;
  const rows = Math.ceil((S + margin * 2) / cell) + 2;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * cell - margin;
      const y = row * cell - margin;
      const pusat = (cx, cy) => ({ cx: cx + stepK * 0.9, cy: cy + stepK * 0.9 });

      // bingkai kawung (4 kelopak) di tiap sel
      const c = pusat(x, y);
      ctx.save();
      if (diagonal) { ctx.translate(c.cx, c.cy); ctx.rotate(Math.PI / 4); ctx.translate(-c.cx, -c.cy); }
      kelopakKawung(ctx, stepK, pilih(R, palet.warna), palet.latar, isian);
      titikTengah(ctx, stepK, pilih(R, palet.warna), palet.latar, punyaTitik);
      ctx.restore();

      // motif tengah di titik pertemuan 4 sel (opsional)
      if (motifTengah && row % 2 === 0 && col % 2 === 0) {
        ctx.save();
        kelopakKawung(ctx, stepK * 0.6, pilih(R, palet.warna), palet.latar, isian);
        titikTengah(ctx, stepK * 0.6, pilih(R, palet.warna), palet.latar, punyaTitik);
        ctx.restore();
      }
    }
  }

  const labelIsian = { padat: 'padat', pola: 'berpola garis', outline: 'outline' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, isian ${labelIsian[isian]}, ${diagonal ? 'diagonal' : 'tegak'} — file: kawung-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `kawung-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
