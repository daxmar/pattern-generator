<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 18 — Generator Pola Feather Plume</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 18 — Generator Pola Feather Plume</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'merak',   latar: '#0a1420', warna: ['#1a7fd0','#1fb8a6','#b0338f','#ffb703','#25d95a','#0f5fa8','#e07c2f'] },
  { nama: 'senja',   latar: '#170d1e', warna: ['#ff6b81','#ffa26b','#c17bff','#ffd166','#a3e048','#f78cb0','#6a82fb'] },
  { nama: 'karang',  latar: '#101418', warna: ['#ff7b54','#ffb26b','#ffd56b','#e56b6f','#9a4b63','#ff9a76','#c9e4c5'] },
  { nama: 'es',      latar: '#0c1622', warna: ['#4fc3f7','#81d4fa','#b3e5fc','#29b6f6','#0288d1','#e1f5fe','#64b5f6'] },
  { nama: 'hutan',   latar: '#0d1a10', warna: ['#7ccb4f','#a5d86b','#4a8f3c','#d0e88a','#2f6b2a','#63b84c','#eaf5c0'] },
];

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const bentuk = pilih(R, ['bulu-solid', 'bulu-rib', 'bulu-outline']);
  const ukuran = rentang(R, 300, 600);
  const opacityVariasi = R() < 0.4;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  const u = ukuran;
  const rad = u * 0.14;
  const stepX = u * 0.72;
  const stepY = u * 0.5;
  const margin = u;
  const cols = Math.ceil((S + margin * 2) / stepX) + 2;
  const rows = Math.ceil((S + margin * 2) / stepY) + 2;

  function gambarBuluh(ctx2, warna, rib) {
    ctx2.beginPath();
    ctx2.moveTo(0, -u * 0.5);
    ctx2.quadraticCurveTo(u * 0.22, -u * 0.2, u * 0.22, 0);
    ctx2.quadraticCurveTo(u * 0.22, u * 0.22, 0, u * 0.5);
    ctx2.quadraticCurveTo(-u * 0.22, u * 0.22, -u * 0.22, 0);
    ctx2.quadraticCurveTo(-u * 0.22, -u * 0.2, 0, -u * 0.5);
    ctx2.closePath();
    if (rib === 'outline') {
      ctx2.strokeStyle = warna;
      ctx2.lineWidth = Math.max(u * 0.04, 5);
      ctx2.stroke();
    } else {
      ctx2.fillStyle = warna;
      ctx2.fill();
    }
    if (rib === 'rib' || rib === 'fill') {
      ctx2.strokeStyle = rib === 'rib' ? palet.latar : palet.warna[(seedInt % palet.warna.length)];
      ctx2.lineWidth = Math.max(u * 0.02, 3);
      ctx2.beginPath();
      ctx2.moveTo(0, -u * 0.45);
      ctx2.quadraticCurveTo(u * 0.14, 0, 0, u * 0.45);
      ctx2.stroke();
    }
  }

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * stepX - margin + (row % 2 ? stepX / 2 : 0);
      const y = row * stepY - margin;
      const warna = pilih(R, palet.warna);
      const sudut = pilih(R, [-0.6, -0.2, 0.2, 0.6]) + (R() < 0.3 ? Math.PI : 0);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(sudut);
      if (opacityVariasi) ctx.globalAlpha = clamp(0.6 + R() * 0.6, 0.45, 1);
      gambarBuluh(ctx, warna, bentuk);
      ctx.beginPath();
      ctx.arc(0, 0, rad, 0, TAU);
      ctx.fillStyle = palet.latar;
      ctx.globalAlpha *= 0.35;
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  const labelBentuk = { 'bulu-solid': 'solid', 'bulu-rib': 'rib', 'bulu-outline': 'outline' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelBentuk[bentuk]}, bulu ${Math.round(u)}px — file: feather-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `feather-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
