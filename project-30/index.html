<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 30 — Generator Pola Dazzle</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 30 — Generator Pola Dazzle</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'camo',    latar: '#0e0e0e', warna: ['#ffffff','#111111','#cccccc','#333333','#888888','#555555','#aaaaaa'] },
  { nama: 'neon',    latar: '#0a0a14', warna: ['#ff00ff','#00ffff','#ffff00','#ff3366','#33ff66','#6633ff','#ff6600'] },
  { nama: 'rust',    latar: '#120a04', warna: ['#b7410e','#cc5500','#d4760a','#8b4513','#cd853f','#a0522d','#daa520'] },
  { nama: 'arctic',  latar: '#08101a', warna: ['#e0f0ff','#a8d8ea','#70c1b3','#247ba0','#b2dbbf','#c3e0ec','#1a535c'] },
  { nama: 'vandal',  latar: '#0a0608', warna: ['#ff1744','#d500f9','#2979ff','#00e676','#ffea00','#ff6d00','#00bfa5'] },
];

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const bentuk = pilih(R, ['kisi', 'blok', 'outline']);

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  if (bentuk === 'kisi') {
    const numLines = rint(R, 30, 70);
    for (let i = 0; i < numLines; i++) {
      const angle = rentang(R, 0, Math.PI);
      const cx = rentang(R, 0, S);
      const cy = rentang(R, 0, S);
      const len = rentang(R, 200, 900);
      const w = rentang(R, 8, 60);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillStyle = pilih(R, palet.warna);
      ctx.globalAlpha = rentang(R, 0.3, 1);
      ctx.fillRect(-len / 2, -w / 2, len, w);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  } else if (bentuk === 'blok') {
    const cellSize = rint(R, 60, 200);
    const cols = Math.ceil(S / cellSize) + 1;
    const rows = Math.ceil(S / cellSize) + 1;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        if (R() < 0.45) continue;
        const x = col * cellSize;
        const y = row * cellSize;
        ctx.fillStyle = pilih(R, palet.warna);
        ctx.globalAlpha = rentang(R, 0.25, 1);
        const pad = rentang(R, 0, cellSize * 0.3);
        ctx.fillRect(x + pad, y + pad, cellSize - pad * 2, cellSize - pad * 2);
      }
    }
    ctx.globalAlpha = 1;
  } else {
    const numShapes = rint(R, 40, 100);
    for (let i = 0; i < numShapes; i++) {
      const x = rentang(R, -200, S + 200);
      const y = rentang(R, -200, S + 200);
      const w = rentang(R, 40, 400);
      const h = rentang(R, 40, 400);
      const angle = rentang(R, 0, Math.PI);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.strokeStyle = pilih(R, palet.warna);
      ctx.lineWidth = rentang(R, 2, 14);
      ctx.globalAlpha = rentang(R, 0.3, 1);
      ctx.strokeRect(-w / 2, -h / 2, w, h);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  const numDiag = rint(R, 15, 40);
  for (let i = 0; i < numDiag; i++) {
    const x1 = rentang(R, -500, S + 500);
    const y1 = rentang(R, -500, S + 500);
    const angle = rentang(R, 0, Math.PI);
    const len = rentang(R, 300, 1500);
    const x2 = x1 + Math.cos(angle) * len;
    const y2 = y1 + Math.sin(angle) * len;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = pilih(R, palet.warna);
    ctx.lineWidth = rentang(R, 2, 20);
    ctx.globalAlpha = rentang(R, 0.2, 0.8);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const labelBentuk = { kisi: 'kisi diagonal', blok: 'blok warna', outline: 'outline geometris' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelBentuk[bentuk]} — file: dazzle-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `dazzle-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
