<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 14 — Generator Pola Confetti</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 14 — Generator Pola Confetti</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'pesta',   latar: '#f7f0e6', warna: ['#e63946','#f4a261','#2a9d8f','#e9c46a','#7b2cbf','#ff70a6','#3a86ff'] },
  { nama: 'candy',   latar: '#fdefef', warna: ['#ff6f91','#ff9671','#ffc75f','#f9f871','#d65db1','#845ec2','#00c9a7'] },
  { nama: 'malam',   latar: '#140a1e', warna: ['#ffd166','#ef476f','#06d6a0','#118ab2','#f78c6b','#c084fc','#00ffcc'] },
  { nama: 'pastel',  latar: '#fcf9f2', warna: ['#a8d8ea','#aa96da','#fcbad3','#b5ead7','#ffd3b6','#c7ceea','#ffe0ac'] },
  { nama: 'neon',    latar: '#0d0d14', warna: ['#ff0054','#00ff88','#ffee00','#00aaff','#ff6600','#cc00ff','#00ffcc'] },
];

const BENTUK = ['lingkaran', 'persegi', 'segitiga', 'bintang', 'rajutan', 'garis'];

function gambarBentuk(ctx, bentuk, uk) {
  ctx.beginPath();
  switch (bentuk) {
    case 'lingkaran':
      ctx.arc(0, 0, uk / 2, 0, TAU);
      break;
    case 'persegi':
      ctx.rect(-uk / 2, -uk / 2, uk, uk);
      break;
    case 'segitiga':
      ctx.moveTo(0, -uk / 2);
      ctx.lineTo(uk / 2, uk / 2);
      ctx.lineTo(-uk / 2, uk / 2);
      ctx.closePath();
      break;
    case 'bintang':
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 === 0 ? uk / 2 : uk * 0.2;
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      break;
    case 'rajutan': {
      const u = uk / 2;
      ctx.arc(0, u * 0.4, u * 0.45, Math.PI, 0);
      ctx.arc(-u * 0.6, 0, u * 0.5, 0, Math.PI);
      ctx.arc(u * 0.6, 0, u * 0.5, Math.PI, 0);
      ctx.arc(0, -u * 0.4, u * 0.55, 0, Math.PI);
      ctx.closePath();
      break;
    }
    case 'garis':
      ctx.moveTo(-uk / 2, 0);
      ctx.lineTo(uk / 2, 0);
      break;
  }
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const jumlah = rint(R, 400, 900);
  const ukuran = rentang(R, 30, 130);
  const mode = pilih(R, ['tabur', 'hujan', 'warnai']);
  const rotasi = R() < 0.8;

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  for (let i = 0; i < jumlah; i++) {
    const x = rentang(R, -ukuran, S + ukuran);
    let y;
    if (mode === 'hujan') {
      y = rentang(R, 0, S);
      const slope = rentang(R, -0.6, 0.6);
      y = y - (x - S / 2) * slope;
      y = ((y % (S + ukuran * 2)) + S + ukuran * 2) % (S + ukuran * 2) - ukuran;
    } else {
      y = rentang(R, -ukuran, S + ukuran);
    }
    const bentuk = pilih(R, BENTUK);
    const warna = pilih(R, palet.warna);
    const uk = ukuran * rentang(R, 0.4, 1.4);
    const opasitas = mode === 'warnai' ? rentang(R, 0.25, 0.7) : rentang(R, 0.5, 1);

    ctx.save();
    ctx.translate(x, y);
    if (rotasi && bentuk !== 'lingkaran') ctx.rotate(rentang(R, 0, Math.PI));
    ctx.fillStyle = warna;
    ctx.strokeStyle = warna;
    ctx.globalAlpha = opasitas;
    if (bentuk === 'garis') {
      ctx.lineWidth = Math.max(uk * 0.12, 3);
      ctx.lineCap = 'round';
      ctx.stroke();
    } else {
      gambarBentuk(ctx, bentuk, uk);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${mode}, ${jumlah} partikel — file: confetti-${seedInt}-<timestamp>.jpg`;
}

function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `confetti-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
