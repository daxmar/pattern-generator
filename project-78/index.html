<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 78 — Generator Pola Shattered Glass</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161a; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 8px 0 16px; font-weight: 600; }
  menu { margin: 0 0 12px; padding: 0; }
  button, input { font-size: 1rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #23262c; color: #eee; cursor: pointer; }
  button:hover { background: #33373f; }
  input { width: 11ch; cursor: text; }
  #info { font-size: .85rem; color: #9aa3ad; margin: 0 0 12px; }
  canvas { width: min(92vmin, 860px); height: auto; display: block; margin: 0 auto 16px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Project 78 — Generator Pola Shattered Glass</h1>
<menu>
  <button id="btnBaru">Generate Pola</button>
  <input id="inputSeed" type="number" placeholder="seed">
  <button id="btnTerapkan">Terapkan Seed</button>
  <button id="btnSimpan">Simpan JPG</button>
</menu>
<p id="info"></p>
<canvas id="kanvas" width="4000" height="4000"></canvas>

<script>
const S = 4000;
const DPI = 300;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rentang = (R, min, max) => min + R() * (max - min);
const rint = (R, min, max) => Math.floor(rentang(R, min, max + 1));
const pilih = (R, arr) => arr[Math.floor(R() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const PALET = [
  { nama: 'laut',   latar: '#0a1628', warna: ['#1a6fa0','#2196c8','#34b5d4','#5cc8e0','#89d8ea','#0e5a7e','#2980b9'] },
  { nama: 'sunset', latar: '#1a0e0a', warna: ['#ff6b35','#ff8c42','#ffa62b','#ffc300','#ffd166','#e85d04','#fb8500'] },
  { nama: 'pastel', latar: '#f5f0eb', warna: ['#a8d8ea','#aa96da','#fcbad3','#ffffd2','#b5ead7','#c7ceea','#ffd3b6'] },
  { nama: 'tropis', latar: '#0a1a0e', warna: ['#2ecc71','#27ae60','#1abc9c','#16a085','#3cb371','#00b894','#55efc4'] },
  { nama: 'neon',   latar: '#0a0a0a', warna: ['#ff0054','#00ff88','#ffee00','#00aaff','#ff6600','#cc00ff','#ffffff'] },
];

/* ==== ISI FUNGSI MOTIF DI BAWAH INI ====
   Pola digambar di AROUND origin (0,0); pemanggil sudah men-translate(x,y).
   Terima param (ctx, warna, ukuran) dan gambar dgn beginPath/rect/arc/lineTo
   relatif ke origin. Pilih ragam lewat param `bentuk` bila perlu. */
function gambarMotif(ctx, warna, ukuran, bentuk) {
  const h = ukuran * 0.5;
  const w = ukuran * 0.035;
  const area = h;
  const n = 7;

  const R_local = mulberry32(ukuran * 1000 + h);

  const shard = (R2, cx, cy, r) => {
    const sudut = rentang(R2, 0, Math.PI * 2);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(sudut), cy + r * Math.sin(sudut));
    ctx.lineTo(cx + r * Math.cos(sudut + 2.1), cy + r * Math.sin(sudut + 2.1));
    ctx.closePath();
  };

  if (bentuk === 'outline') {
    ctx.strokeStyle = warna;
    ctx.lineWidth = w;
    for (let i = 0; i < n; i++) {
      const cx = rentang(R_local, -area, area);
      const cy = rentang(R_local, -area, area);
      const r = rentang(R_local, h * 0.25, area);
      ctx.beginPath();
      shard(R_local, cx, cy, r);
      ctx.stroke();
    }
    return;
  }

  for (let i = 0; i < n; i++) {
    const cx = rentang(R_local, -area, area);
    const cy = rentang(R_local, -area, area);
    const r = rentang(R_local, h * 0.25, area);
    ctx.beginPath();
    shard(R_local, cx, cy, r);
    if (bentuk === 'ganda') {
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.3)' : warna;
    } else {
      ctx.fillStyle = warna;
    }
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = w;
    ctx.stroke();
  }
}

function render(seedInt) {
  const R = mulberry32(seedInt);
  const palet = pilih(R, PALET);
  const bentuk = pilih(R, ['solid', 'outline', 'ganda']);
  const ukuran = rentang(R, 200, 600);

  const ctx = kanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palet.latar;
  ctx.fillRect(0, 0, S, S);

  // TILING PENUH LAYAR: hitung cols/rows agar menutup 0..4000 untuk seluruh rentang acak.
  // margin >= ukuran motif (jangan 0). cols = ceil((S + margin*2)/jarakX) + 2, dll.
  const margin = ukuran * 1.2;
  const cols = Math.ceil((S + margin * 2) / ukuran) + 2;
  const rows = Math.ceil((S + margin * 2) / ukuran) + 2;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * ukuran - margin;
      const y = row * ukuran - margin;
      const warna = pilih(R, palet.warna);

      ctx.save();
      ctx.translate(x, y);   // PENTING: pindah origin ke posisi motif (lihat bug umum)
      gambarMotif(ctx, warna, ukuran, bentuk);
      ctx.restore();
    }
  }

  const labelBentuk = { solid: 'solid', outline: 'outline', ganda: 'ganda' };
  info.textContent = `Seed ${seedInt} · ${palet.nama}, ${labelBentuk[bentuk]}, ${Math.round(ukuran)}px — file: ${'shattered'}-${seedInt}-<timestamp>.jpg`;
}

// ===== BAGIAN DI BAWAH INI JANGAN DIEDIT DARI TEMPLATE =====
function setJfifDensity(bytes, dpi) {
  if (bytes[0] !== 0xff || bytes[1] !== 0xd8) throw new Error('bukan JPEG');
  let i = 2;
  while (i + 3 < bytes.length && bytes[i] === 0xff) {
    const marker = bytes[i + 1];
    if (marker === 0xe0) {
      const out = bytes.slice();
      out[i + 11] = 1;
      out[i + 12] = (dpi >> 8) & 0xff;
      out[i + 13] = dpi & 0xff;
      out[i + 14] = (dpi >> 8) & 0xff;
      out[i + 15] = dpi & 0xff;
      return out;
    }
    if (marker === 0xda) break;
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
  }
  const app0 = Uint8Array.of(
    0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00,
    0x01, 0x02, 0x01,
    (dpi >> 8) & 0xff, dpi & 0xff,
    (dpi >> 8) & 0xff, dpi & 0xff,
    0x00, 0x00
  );
  const out = new Uint8Array(app0.length + bytes.length - 2);
  out.set(bytes.subarray(0, 2), 0);
  out.set(app0, 2);
  out.set(bytes.subarray(2), 2 + app0.length);
  return out;
}

let dirHandle = null;

async function simpanJpg() {
  const nama = `shattered-${seed}-${Date.now()}.jpg`;
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/jpeg', 0.92));
  const data = setJfifDensity(new Uint8Array(await blob.arrayBuffer()), DPI);
  const jpg = new Blob([data], { type: 'image/jpeg' });

  if (window.showDirectoryPicker) {
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const fh = await dirHandle.getFileHandle(nama, { create: true });
    const w = await fh.createWritable();
    await w.write(jpg);
    await w.close();
    info.textContent += ` · tersimpan: ${nama}`;
  } else {
    const url = URL.createObjectURL(jpg);
    const a = document.createElement('a');
    a.href = url; a.download = nama; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    info.textContent += ` · terunduh: ${nama} (pindahkan ke hasil/)`;
  }
}

const kanvas = document.getElementById('kanvas');
const info = document.getElementById('info');
const inputSeed = document.getElementById('inputSeed');
let seed = 0;

document.getElementById('btnBaru').onclick = () => {
  seed = (Math.random() * 2 ** 31) | 0;
  inputSeed.value = seed;
  render(seed);
};
document.getElementById('btnTerapkan').onclick = () => {
  const v = parseInt(inputSeed.value, 10);
  if (Number.isFinite(v)) { seed = v | 0; render(seed); }
};
document.getElementById('btnSimpan').onclick = simpanJpg;

seed = (Math.random() * 2 ** 31) | 0;
inputSeed.value = seed;
render(seed);
</script>
</body>
</html>
